codecov:
  require_ci_to_pass: false
  max_report_age: off

coverage:
  precision: 2
  round: down
  range: '0...100'
  status:
    # Global project coverage is ratcheted by the Vitest thresholds in
    # vitest.config.ts (which fail CI on regression). Keep the Codecov project
    # status informational to avoid a second, noisier gate on the same signal.
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    # Patch coverage IS enforced: new/changed lines must be tested. This is how
    # overall coverage ramps toward the 80% goal without a flag-day rewrite.
    patch:
      default:
        target: 50%
        threshold: 0%
        informational: false

comment:
  layout: 'reach,diff,flags,files'
  behavior: default
  require_changes: false

ignore:
  - 'tests/**'
  - 'docs/**'
  - '**/*.md'
  - '**/*.d.ts'
  - 'packages/desktop/src/index.ts'
  - 'packages/desktop/src/preload.ts'
  - 'packages/desktop/src/common/utils/shims/**'
  - 'packages/desktop/src/common/types/**'
  - 'packages/desktop/src/common/config/i18n-config.json'
  - 'packages/desktop/src/renderer/**/*.json'
  - 'packages/desktop/src/renderer/**/*.svg'
  - 'packages/desktop/src/renderer/**/*.css'
  - 'scripts/**'
  - 'examples/**'
  - 'mobile/**'
  - 'resources/**'
  - 'skills/**'
  - 'assistant/**'
  - 'homebrew/**'
  - 'patches/**'
